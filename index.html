<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smileat · Reporte Mensual Ads</title>
<style>

  /* ============================================================
     1) TU CONTENIDO VIVE EN EL <script>, AL FINAL DEL ARCHIVO
        (busca CONTENIDO). Para actualizar el reporte cada mes:
        - Cambia MES
        - Rellena MIMO (mantener / incorporar / mejorar / omitir)
        - Rellena PROMOS con los lanzamientos del mes (y sus
          creatividades, se muestran en un carrusel dentro de
          cada tarjeta)
        - Rellena META_KPIS / META_CREATIVOS
        - Rellena GOOGLE_KPIS / GOOGLE_CAMPANAS
        - El ORDEN en que escribas las creatividades de Meta es el
          orden en que se muestran → colócalas de mejor a peor.
     ============================================================ */

  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

  :root{
    --brand: #29abe2;
    --meta: #0866ff;
    --google: #ea4335;
    --ink: #10222c;
    --ink-dim: #7c8a96;
    --page-bg: #eef3f6;
    --card-bg: #ffffff;
    --chip-bg: #f3f6f9;
    --line: #e3eaf0;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: 'Montserrat', sans-serif;
    font-variant-numeric: tabular-nums;
  }

  /* cabecera */
  header{
    background: var(--brand);
    color: #ffffff;
    padding: 26px 24px 28px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header .logo-chip{
    background: #ffffff;
    border-radius: 12px;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    line-height: 0;
  }
  header img.logo{ height: 32px; width: auto; }
  header h1{
    margin: 0;
    font-family: 'Nunito', sans-serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.03em;
  }
  header p{
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
  }

  /* secciones generales */
  .section{
    max-width: 1240px;
    margin: 0 auto;
    padding: 36px 20px 8px;
  }
  .section h2{
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section .section-sub{
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-dim);
    margin: 0 0 18px;
  }
  .platform-dot{ width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .platform-dot.meta{ background: var(--meta); }
  .platform-dot.google{ background: var(--google); }
  .empty{
    font-size: 12px;
    color: var(--ink-dim);
    font-style: italic;
  }

  /* ---------------- MIMO ---------------- */
  .mimo-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .mimo-card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 16px;
    box-shadow: 0 1px 3px rgba(16,34,44,0.06);
    border-top: 4px solid var(--c);
  }
  .mimo-card h3{
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    margin: 0 0 4px;
    color: var(--c);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .mimo-card .mimo-icon{ font-size: 18px; margin-right: 4px; }
  .mimo-card ul{
    margin: 10px 0 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
  }
  .mimo-card ul li{ margin-bottom: 6px; }
  .mimo-card .empty{ margin-top: 10px; }
  @media (max-width: 900px){ .mimo-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .mimo-grid{ grid-template-columns: 1fr; } }

  /* ---------------- Promos / lanzamientos ---------------- */
  .promos-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .promo-card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px 18px;
    box-shadow: 0 1px 3px rgba(16,34,44,0.06);
  }
  .promo-card .promo-fecha{
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 800;
    color: var(--brand);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .promo-card h4{
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .promo-card p{
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    margin: 0 0 10px;
  }
  .promo-badges{ display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .promo-badge{
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
  }
  .promo-badge.meta{ background: var(--meta); }
  .promo-badge.google{ background: var(--google); }
  @media (max-width: 900px){ .promos-grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px){ .promos-grid{ grid-template-columns: 1fr; } }

  /* carrusel de creatividades dentro de la promo — 1 imagen visible + flechas */
  .promo-carousel{ position: relative; margin-top: 12px; }
  .promo-carousel-slide{
    position: relative;
    background: #10222c;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 4 / 5;
  }
  .promo-carousel-slide img,
  .promo-carousel-slide video{
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .promo-carousel-counter{
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(16,34,44,0.65);
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .promo-carousel-label{
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
    margin-top: 6px;
    line-height: 1.3;
  }
  .promo-carousel-nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #ffffff;
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(16,34,44,0.15);
    z-index: 2;
  }
  .promo-carousel-nav.prev{ left: 8px; }
  .promo-carousel-nav.next{ right: 8px; }

  /* ---------------- resumen de métricas (KPI bar) ---------------- */
  .kpi-bar{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .kpi{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(16,34,44,0.06);
  }
  .kpi .kpi-val{
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
  }
  .kpi .kpi-lab{
    font-family: 'Montserrat', sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .kpi .kpi-delta{
    font-family: 'Nunito', sans-serif;
    font-size: 10.5px;
    font-weight: 800;
    margin-top: 6px;
  }
  .kpi .kpi-delta.good{ color: #1a8f4c; }
  .kpi .kpi-delta.bad{ color: #c23a2a; }
  .kpi .kpi-delta.neutral{ color: var(--ink-dim); }

  /* conclusiones / lectura rápida */
  .conclusiones{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-left: 4px solid var(--brand);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 26px;
  }
  .conclusiones h3{
    font-family: 'Nunito', sans-serif;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--brand);
    margin: 0 0 8px;
  }
  .conclusiones ul{
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
  }
  .conclusiones ul li{ margin-bottom: 6px; }

  /* ---------------- creatividades Meta (cards) ---------------- */
  .creativos{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
    padding-bottom: 10px;
  }
  .card{
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(16,34,44,0.06);
    display: flex;
    flex-direction: column;
  }
  .rank{
    position: absolute;
    top: 14px; left: 14px;
    background: var(--meta);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    z-index: 2;
  }
  .media{ background: #10222c; aspect-ratio: 4 / 5; overflow: hidden; }
  .media img, .media video{ width: 100%; height: 100%; object-fit: cover; display:block; }
  .card-body{ padding: 16px 16px 18px; }
  .card-title{
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .badge-new{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff4e0;
    color: #a5670a;
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .stats{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat{ background: var(--chip-bg); border-radius: 10px; padding: 9px 6px; text-align: center; }
  .stat .val{
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1.2;
  }
  .stat .lab{
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .stat.good{ background: #e3f6ea; } .stat.good .val{ color: #1a8f4c; }
  .stat.mid{ background: #fdf3d7; } .stat.mid .val{ color: #9a6b00; }
  .stat.bad{ background: #fbe6e3; } .stat.bad .val{ color: #c23a2a; }
  @media (max-width: 560px){ .creativos{ grid-template-columns: 1fr; } }

  /* ---------------- tabla Google (campañas) ---------------- */
  .tabla-card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(16,34,44,0.06);
    margin-bottom: 10px;
    overflow-x: auto;
  }
  table.tabla{ width: 100%; border-collapse: collapse; }
  .tabla thead th{
    background: var(--google);
    color: #ffffff;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-align: left;
    padding: 10px 14px;
    white-space: nowrap;
  }
  .tabla thead th.num{ text-align: right; }
  .tabla thead th.head-meta{ background: var(--meta); }
  .tabla td.rank-num{ font-family: 'Nunito', sans-serif; font-weight: 800; color: var(--ink-dim); }
  .tabla tbody td{
    padding: 10px 14px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    color: var(--ink);
    border-top: 1px solid var(--line);
    white-space: nowrap;
  }
  .tabla tbody tr:nth-child(even){ background: var(--chip-bg); }
  .tabla td.num{ text-align: right; font-variant-numeric: tabular-nums; }
  .tabla td.nombre{ font-weight: 700; white-space: normal; }
  .tabla td.num.good{ color: #1a8f4c; font-weight: 700; }
  .tabla td.num.mid{ color: #9a6b00; font-weight: 700; }
  .tabla td.num.bad{ color: #c23a2a; font-weight: 700; }
  @media (max-width: 560px){ .tabla thead th, .tabla tbody td{ padding: 8px 8px; font-size: 12px; } }

  /* ---------------- top productos por ingresos (dentro de Meta/Google) ---------------- */
  .top-productos-titulo{
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    margin: 26px 0 4px;
  }

  footer{
    text-align:center;
    padding: 30px 16px 40px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    color: var(--ink-dim);
  }

</style>
</head>
<body>

  <header>
    <div class="logo-chip">
      <img class="logo" src="assets/logo-smileat.jpg" alt="Smileat">
    </div>
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </header>

  <!-- ==================== MIMO (compartido Meta + Google) ==================== -->
  <section class="section">
    <h2>🧭 MIMO del próximo mes</h2>
    <p class="section-sub">Mantener · Incorporar · Mejorar · Omitir — de cara al próximo mes, en base a lo visto en Meta y Google Ads</p>
    <div class="mimo-grid" id="mimo-grid"></div>
  </section>

  <!-- ==================== Promociones / lanzamientos ==================== -->
  <section class="section">
    <h2>🚀 Promociones y lanzamientos del mes</h2>
    <p class="section-sub" id="promos-sub"></p>
    <div class="promos-grid" id="promos-grid"></div>
  </section>

  <!-- ==================== META ADS ==================== -->
  <section class="section">
    <h2><span class="platform-dot meta"></span> Meta Ads</h2>
    <p class="section-sub" id="meta-sub"></p>
    <div class="kpi-bar" id="meta-kpis"></div>
    <div class="conclusiones" id="meta-conclusiones"></div>
    <div class="creativos" id="meta-creativos"></div>
    <h3 class="top-productos-titulo">🛍️ Top 10 productos por ingresos</h3>
    <p class="section-sub" id="top-meta-sub"></p>
    <div class="tabla-card"><table class="tabla" id="top-meta-tabla"></table></div>
  </section>

  <!-- ==================== GOOGLE ADS ==================== -->
  <section class="section">
    <h2><span class="platform-dot google"></span> Google Ads</h2>
    <p class="section-sub" id="google-sub"></p>
    <div class="kpi-bar" id="google-kpis"></div>
    <div class="conclusiones" id="google-conclusiones"></div>
    <h3 class="top-productos-titulo">🛍️ Top 10 productos por ingresos</h3>
    <p class="section-sub" id="top-google-sub"></p>
    <div class="tabla-card"><table class="tabla" id="top-google-tabla"></table></div>
  </section>

  <footer id="pie"></footer>

<script>

  /* ============================================================
     CONTENIDO — EDITA SOLO A PARTIR DE AQUÍ
     ============================================================ */

  const MES = "Julio 2026"; // 👈 cambia el mes de cada reporte (mismo rango para Meta y Google)
  const COMPARATIVA = "vs. junio 2026"; // 👈 mes de comparación (Google Ads ya trae esta comparación en su export)

  /* ------------------------------------------------------------
     MIMO — compartido entre Meta y Google.
     ------------------------------------------------------------ */

    ],
    mejorar: [
      "Configuración de las tiendas dentro de Meta (actualmente hay, pero hay que optimizarla y buscar puntos fuertes)",
      "Mejorar CTAs de conversión",
      "Seguir mejorando la frecuencia de los anuncios",
    ],
    omitir: [
      // Nada que omitir este mes
    ],
  };

  /* ------------------------------------------------------------
     PROMOCIONES / LANZAMIENTOS DEL MES
     Cada promo puede llevar su propio carrusel de creatividades
     (las piezas de imagen/video que formaron esa campaña).
     ------------------------------------------------------------ */
  const PROMOS_SUB = "Campañas y ofertas activas durante " + MES;
  const PROMOS = [
    {
      fecha: "1 – 16 jul",
      nombre: "Neverita gratis",
      descripcion: "Regalo de neverita en pedidos superiores a 40€, activa en Meta y Google.",
      plataformas: ["meta", "google"],

      ],
    },
    {

      plataformas: ["meta", "google"],
      creatividades: [
        { type: "image", src: "media/smilotes/lanzamiento-publi-1.jpg", nota: "Lanzamiento Smilotes · v1" },
        { type: "image", src: "media/smilotes/lanzamiento-publi-2.jpg", nota: "Lanzamiento Smilotes · v2" },
        { type: "image", src: "media/smilotes/lanzamiento-publi-3.jpg", nota: "Lanzamiento Smilotes · v3" },
        { type: "image", src: "media/smilotes/lanzamiento-publi-4.jpg", nota: "Lanzamiento Smilotes · v4" },
      ],

    {
      fecha: "26 jul – 2 ago",
      nombre: "15% Packs / 25% Suscripción",
      descripcion: "Promo de packs con descuento y primer mes de suscripción, activa en Meta y Google.",

        { type: "video", src: "media/packs-15-subs-25/video-consumo.mp4", nota: "Vídeo consumo" },
      ],
    },
    // 👇 Además de estas 3, en la carpeta de creatividades hay 2 tandas más
    // (SMILADOS y Suscripción) que no me diste como "promo" con fechas.
    // Si son lanzamientos puntuales, copia este bloque y rellena fecha/descripción;
    // si son creatividades "always on" sin fecha de promo, dímelo y las meto
    // directamente en el bloque de creatividades de Meta sin tarjeta de promo.

    //     { type: "image", src: "media/suscripcion/post-tarrito-2.jpg", nota: "Post tarrito 2" },

  ];

  /* ------------------------------------------------------------
     META ADS
     Métricas pensadas para no quedarnos solo en eCommerce (ROAS,

      <div class="stat${clsColor}">
        <div class="val">${m[key] ?? '—'}</div>
        <div class="lab">${label}</div>
      </div>`;
    }).join('');
    const badgeNuevaHtml = item.nueva ? `<span class="badge-new">🆕 ${item.nueva}</span>` : '';
    card.innerHTML = `
      <div class="rank">#${i + 1}</div>
      <div class="media">${mediaEl}</div>
      <div class="card-body">
        <p class="card-title">${item.nota || ''}</p>
        ${badgeNuevaHtml}
        <div class="stats">${statsHtml}</div>
      </div>
    `;
    listaMeta.appendChild(card);
  });

  // ---- Top 10 productos por ingresos ----
  document.getElementById('top-meta-sub').textContent = TOP_META_SUB;
  document.getElementById('top-google-sub').textContent = TOP_GOOGLE_SUB;

  function renderTopProductos(tablaId, productos, headClass){
    const filas = productos.map((p, i) => `
      <tr>
        <td class="num rank-num">#${i + 1}</td>
        <td class="nombre">${p.nombre}</td>
        <td class="num">${p.comprados.toLocaleString('es-ES')}</td>
        <td class="num">${p.carrito.toLocaleString('es-ES')}</td>
        <td class="num">${p.ingresos}</td>
      </tr>`).join('');
    document.getElementById(tablaId).innerHTML = `
      <thead>
        <tr>
          <th class="num ${headClass}">#</th>
          <th class="${headClass}">Producto</th>
          <th class="num ${headClass}">Comprados</th>
          <th class="num ${headClass}">Añadidos carrito</th>
          <th class="num ${headClass}">Ingresos</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    `;
  }
  renderTopProductos('top-google-tabla', TOP_GOOGLE_PRODUCTOS, '');
  renderTopProductos('top-meta-tabla', TOP_META_PRODUCTOS, 'head-meta');

  // Nota: a partir de este mes la tabla de campañas de Google ya no se
  // muestra en el reporte (se deja solo el resumen de KPIs + lectura rápida).
  // GOOGLE_CAMPANAS y GOOGLE_COLUMNAS se conservan arriba como fuente de
  // datos interna, por si se necesita el detalle en algún momento.

</script>
